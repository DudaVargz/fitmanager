{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>👥 Clientes</h2>
    <a href="{% url 'cadastrar_cliente' %}" class="btn btn-success">+ Novo Cliente</a>
</div>
<table class="table table-striped">
    <thead class="table-dark">
        <tr><th>Nome</th><th>Telefone</th><th>Email</th><th>Ações</th></tr>
    </thead>
    <tbody>
        {% for c in clientes %}
        <tr>
            <td>{{ c.nome }}</td>
            <td>{{ c.telefone }}</td>
            <td>{{ c.email }}</td>
            <td>
                <a href="{% url 'editar_cliente' c.pk %}" class="btn btn-sm btn-primary">Editar</a>
                <a href="{% url 'excluir_cliente' c.pk %}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Remover cliente?')">Remover</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
