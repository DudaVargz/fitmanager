{% extends 'base.html' %}
{% block content %}
<h2>{% if agendamento %}Editar{% else %}Novo{% endif %} Agendamento</h2>
<form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Cliente</label>
        <select name="cliente" class="form-select" required>
            {% for c in clientes %}
            <option value="{{ c.pk }}" {% if agendamento.cliente_id == c.pk %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Profissional</label>
        <select name="profissional" class="form-select" required>
            {% for p in profissionais %}
            <option value="{{ p.pk }}" {% if agendamento.profissional_id == p.pk %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Serviço</label>
        <select name="servico" class="form-select" required>
            {% for s in servicos %}
            <option value="{{ s.pk }}" {% if agendamento.servico_id == s.pk %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Data e Hora</label>
        <input type="datetime-local" name="data_hora" class="form-control" required
               value="{{ agendamento.data_hora|date:'Y-m-d\TH:i' }}">
    </div>
    {% if agendamento %}
    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
            <option value="agendado" {% if agendamento.status == 'agendado' %}selected{% endif %}>Agendado</option>
            <option value="confirmado" {% if agendamento.status == 'confirmado' %}selected{% endif %}>Confirmado</option>
            <option value="concluido" {% if agendamento.status == 'concluido' %}selected{% endif %}>Concluído</option>
            <option value="cancelado" {% if agendamento.status == 'cancelado' %}selected{% endif %}>Cancelado</option>
        </select>
    </div>
    {% endif %}
    <div class="mb-3">
        <label class="form-label">Observações</label>
        <textarea name="observacoes" class="form-control" rows="3">{{ agendamento.observacoes }}</textarea>
    </div>
    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
