{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>🏃 Serviços</h2>
    <a href="{% url 'cadastrar_servico' %}" class="btn btn-success">+ Novo Serviço</a>
</div>
<table class="table table-striped">
    <thead class="table-dark">
        <tr><th>Nome</th><th>Duração</th><th>Preço</th><th>Ações</th></tr>
    </thead>
    <tbody>
        {% for s in servicos %}
        <tr>
            <td>{{ s.nome }}</td>
            <td>{{ s.duracao_minutos }} min</td>
            <td>R$ {{ s.preco }}</td>
            <td>
                <a href="{% url 'editar_servico' s.pk %}" class="btn btn-sm btn-primary">Editar</a>
                <a href="{% url 'excluir_servico' s.pk %}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Remover serviço?')">Remover</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
