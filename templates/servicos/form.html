{% extends 'base.html' %}
{% block content %}
<h2>{% if servico %}Editar{% else %}Novo{% endif %} Serviço</h2>
<form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" name="nome" class="form-control" required value="{{ servico.nome }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Descrição</label>
        <textarea name="descricao" class="form-control" rows="3">{{ servico.descricao }}</textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Duração (minutos)</label>
        <input type="number" name="duracao_minutos" class="form-control" required value="{{ servico.duracao_minutos }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Preço (R$)</label>
        <input type="number" step="0.01" name="preco" class="form-control" required value="{{ servico.preco }}">
    </div>
    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="{% url 'lista_servicos' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
