{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>🏋️ Profissionais</h2>
    <a href="{% url 'cadastrar_profissional' %}" class="btn btn-success">+ Novo Profissional</a>
</div>
<table class="table table-striped">
    <thead class="table-dark">
        <tr><th>Nome</th><th>Especialidade</th><th>Telefone</th><th>Ações</th></tr>
    </thead>
    <tbody>
        {% for p in profissionais %}
        <tr>
            <td>{{ p.nome }}</td>
            <td>{{ p.especialidade }}</td>
            <td>{{ p.telefone }}</td>
            <td>
                <a href="{% url 'editar_profissional' p.pk %}" class="btn btn-sm btn-primary">Editar</a>
                <a href="{% url 'excluir_profissional' p.pk %}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Remover profissional?')">Remover</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
